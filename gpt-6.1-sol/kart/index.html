<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3d4f77">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%233d4f77'/%3E%3Cpath d='M13 40h38l-5-18H22z' fill='%23ffb83e'/%3E%3Ccircle cx='20' cy='45' r='7' fill='%23ffffff'/%3E%3Ccircle cx='46' cy='45' r='7' fill='%23ffffff'/%3E%3C/svg%3E">
  <title>ソラネジ・カート｜風針草原ループ</title>
  <link rel="stylesheet" href="./src/style.css">
  <!-- Three.js の版はここで固定する（0.186.1）。版と読み込み先を変えない。 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main id="game" aria-label="ソラネジ・カート 3Dレース">
    <div id="hud">
      <header class="race-heading">
        <div class="wordmark">ソラネジ<span>カート</span></div>
        <div class="course">風針草原ループ <span>3周レース</span></div>
      </header>
      <section class="race-stats" aria-label="レース情報">
        <div class="lap-plate"><span>周回</span><strong><b id="lap">1</b><small> / 3</small></strong></div>
        <div class="time-plate"><span>ラップタイム</span><strong id="lap-time">00:00.000</strong><small>ベスト <b id="best-time">—</b></small></div>
      </section>
      <section class="position-plate" aria-label="現在の順位"><span>順位</span><strong id="place">1</strong><small>/ 4</small></section>
      <ol id="standings" aria-label="順位表"></ol>
      <div class="map-plate"><svg id="minimap" viewBox="-100 -90 200 180" role="img" aria-label="コースと各カートの現在地"></svg><span>風針草原</span></div>
      <section class="speed-plate" aria-label="現在の速度"><div><strong id="speed">0</strong><span>km/h</span></div><div class="speed-meter"><i id="speed-fill"></i></div><small id="drive-status">スタートを待とう</small></section>
      <div id="countdown" role="status"><strong id="countdown-number">3</strong><span id="countdown-label">まもなくスタート</span></div>
      <div id="lap-notice" hidden></div>
      <footer class="controls"><span><kbd>W</kbd><kbd>↑</kbd> アクセル</span><span><kbd>S</kbd><kbd>↓</kbd> ブレーキ・後退</span><span><kbd>A D</kbd><kbd>← →</kbd> ハンドル</span><span><kbd>Shift</kbd><kbd>Space</kbd> ドリフト</span></footer>
    </div>
    <div class="utility"><button id="sound" type="button" aria-pressed="false">サウンド：OFF</button><button id="restart" type="button" title="Rキーでもやり直せます">やり直す <kbd>R</kbd></button></div>
    <section id="finish" hidden role="dialog" aria-modal="true" aria-labelledby="finish-title">
      <div class="finish-panel"><span class="finish-course">風針草原ループ · 3周完走</span><h1 id="finish-title">ゴール！</h1><p><strong id="final-place">1</strong> 位 <span>/ 4</span></p><dl><div><dt>レースタイム</dt><dd id="total-time">—</dd></div><div><dt>ベストラップ</dt><dd id="final-best">—</dd></div></dl><ol id="lap-results"></ol><button id="race-again" type="button">もう一度レース</button><small>ルミポ、おつかれさま！</small></div>
    </section>
    <div class="touch-controls" aria-label="タッチ操作"><button data-input="left" aria-label="左">◀</button><button data-input="right" aria-label="右">▶</button><button data-input="drift">ドリフト</button><button data-input="down">ブレーキ</button><button data-input="up">アクセル</button></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
